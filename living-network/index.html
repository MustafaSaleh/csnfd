<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living Network — conceptual architecture explainer</title>
<meta name="description" content="Independent interactive explainer: how Cisco networking and security products work together across data, identity, policy, threat and trust.">
<meta name="referrer" content="no-referrer">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root{
  --bg:#070b16; --bg2:#0c1222; --panel:#0f172b; --panel2:#141e37; --line:#22304f; --line2:#31436b;
  --tx:#e6ecfa; --tx2:#a9b6d3; --tx3:#7385aa;
  --data:#4cc9f0; --identity:#b79cff; --policy:#f4c95d; --threat:#ff7a6b; --trust:#5be3a4;
  --lens:var(--data);
  --ok:#5be3a4; --limit:#8ed0ff; --step:#f4c95d; --block:#ff7a6b; --contain:#ff5fa2;
  --r:10px; --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--font);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}
body[data-lens=data]{--lens:var(--data)} body[data-lens=identity]{--lens:var(--identity)}
body[data-lens=policy]{--lens:var(--policy)} body[data-lens=threat]{--lens:var(--threat)} body[data-lens=trust]{--lens:var(--trust)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--data)}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
#top{display:flex;gap:9px;align-items:center;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:15px;font-weight:650;letter-spacing:.01em}
.brand p{font-size:11px;color:var(--tx3)}
.lenses{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.lenses button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--tx2);display:flex;gap:6px;align-items:center}
.lenses button i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.55}
.lenses button kbd{font:10px var(--font);color:var(--tx3)}
.lenses button[aria-checked=true]{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--tx);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
.lenses button[aria-checked=true] i{opacity:1;box-shadow:0 0 8px var(--c)}
.search{margin-left:auto;position:relative;display:flex;gap:6px}
#spT[aria-pressed=true]{border-color:#ff8a3d;color:#ffb37a;background:#ff8a3d1f}
#spT[aria-pressed=false]{color:var(--tx3)}
.tg{padding:6px 8px}
.tg[aria-pressed=true]{border-color:var(--lens);color:var(--tx);background:color-mix(in srgb,var(--lens) 14%,transparent)}
.tg[aria-pressed=false]{color:var(--tx3);text-decoration:line-through}
.search input,.search select,.tp select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px}
.search input{width:150px} .search select{max-width:150px}
#qres{position:absolute;top:calc(100% + 4px);right:0;width:300px;max-height:320px;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);z-index:30;box-shadow:0 12px 30px #0008}
#qres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 10px}
#qres button:hover,#qres button:focus-visible{background:#ffffff10}
#qres small{display:block;color:var(--tx3);font-size:11px}

/* layout */
main{display:grid;grid-template-columns:300px minmax(0,1fr) 350px;min-height:0}
.panel{background:var(--panel);overflow:auto;min-height:0;overscroll-behavior:contain}
#left{border-right:1px solid var(--line);grid-column:1;grid-row:1}
#stage{grid-column:2;grid-row:1}
#right{border-left:1px solid var(--line);grid-column:3;grid-row:1}
.panel h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:650}
.pad{padding:12px 14px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:10px 14px;position:sticky;top:0;background:var(--panel);z-index:5;border-bottom:1px solid var(--line)}
.modes button{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 2px;font-size:11.5px;font-weight:600;color:var(--tx2);white-space:nowrap}
.modes button[aria-selected=true]{background:var(--panel2);border-color:var(--lens);color:var(--tx)}

/* presets */
.pg{margin:12px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.preset{display:flex;gap:9px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;align-items:baseline}
.preset:hover{background:#ffffff08}
.preset[aria-current=true]{background:var(--panel2);border-color:var(--line2)}
.preset b{font:600 11px var(--font);color:var(--tx3);min-width:18px;font-variant-numeric:tabular-nums}
.preset span{font-size:13px}

/* builder */
.slotbar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.slotbar button,.btn{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600}
.slotbar button[aria-pressed=true]{border-color:var(--lens);background:var(--panel2)}
.btn[aria-pressed=true]#splitB{border-color:var(--lens);background:var(--panel2)}
.btn.primary{background:var(--lens);color:#06101f;border-color:transparent}
.pk{margin-bottom:12px}
.pk h3{font-size:12px;font-weight:650;margin-bottom:5px;display:flex;gap:6px;align-items:baseline}
.pk h3 b{color:var(--lens);font-size:11px}
.pk h3 small{color:var(--tx3);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;color:var(--tx2)}
.chip:hover{border-color:var(--line2)}
.chip[aria-checked=true]{background:color-mix(in srgb,var(--lens) 16%,transparent);border-color:var(--lens);color:var(--tx)}
.chip.off[aria-checked=true]{background:color-mix(in srgb,var(--block) 16%,transparent);border-color:var(--block);color:var(--tx);text-decoration:line-through}
.chip[aria-disabled=true]{opacity:.38;cursor:not-allowed;text-decoration:line-through;text-decoration-color:#fff5}
.why{font-size:11px;color:var(--tx3);margin-top:4px;min-height:15px}
.notes{font-size:11px;color:var(--policy);margin:6px 0}
.bg{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);width:100%;margin-top:4px}

/* explore list */
.exlist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;font-size:13px}
.exlist button:hover{background:#ffffff08}
.exlist small{color:var(--tx3);font-size:11px}

/* stage */
#stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#0d1730 0%,var(--bg) 70%);min-height:0}
#gl,#svg2d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;background:#0a1020cc;border:1px solid #ffffff14;border-radius:6px;padding:1px 6px 2px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--tx);line-height:1.25;text-align:center;will-change:transform}
.lbl small{display:block;font-weight:400;font-size:9.5px;color:var(--lens)}
.lbl.place{font-weight:500;color:var(--tx2);background:#0a102088;border-color:transparent;font-size:10.5px}
.lbl.zone{pointer-events:none;background:none;border:0;color:var(--tx3);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
.lbl.off{opacity:.42} .lbl.off small{display:none}
.lbl.hit{border-color:var(--lens);box-shadow:0 0 0 1px var(--lens)}
.lbl.sel{border-color:#fff;background:#16223f}
.lbl.filtered{opacity:.12}
.lbl.cull{opacity:0;pointer-events:none}
.lbl.cull:focus-visible{opacity:1;z-index:5}
.lbl.hit,.lbl.sel{z-index:3}
#labels.compact .lbl small{display:none}
#labels.narrow .lbl.zone{display:none}
#labels.compact .lbl.hit small,#labels.compact .lbl.sel small{display:block}
.tchip{position:absolute;left:0;top:0;pointer-events:none;z-index:4;font:600 12px var(--font);padding:2px 7px;border-radius:999px;background:#0a1020;border:1.5px solid var(--c,#fff);color:var(--c,#fff);white-space:nowrap}
/* game-style effects */
#fxflash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,var(--fc,#fff) 135%)}
#fxflash.go{animation:fxflash .9s ease-out}
@keyframes fxflash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}
#labels2{position:absolute;inset:0;pointer-events:none}
#splitUI{display:none;position:absolute;inset:0;pointer-events:none}
#stage.split #splitUI{display:block}
#splitUI i{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(#0000,var(--line2) 12%,var(--line2) 88%,#0000)}
#splitUI b{position:absolute;top:44px;left:12px;font:800 13px var(--font);width:24px;height:24px;line-height:22px;text-align:center;border-radius:6px;border:1px solid var(--line2);background:#0a1020cc}
#splitUI b+b{left:calc(50% + 12px);color:#ffd9a8}
#stage.split #fxstamp{left:25%;font-size:clamp(16px,2.4vw,30px)}
#stage.split #fxstamp2{left:75%;font-size:clamp(16px,2.4vw,30px)}
#stage.split #legend{display:none}
#fxstamp,#fxstamp2{position:absolute;left:50%;top:17%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;white-space:nowrap;font:800 clamp(22px,4.6vw,54px)/1 var(--font);letter-spacing:.14em;color:var(--fc,#fff);text-shadow:0 0 18px var(--fc,#fff),0 0 2px #000;padding:.25em .6em;border:3px solid var(--fc,#fff);border-radius:12px;background:#070b16b8}
#fxstamp.go,#fxstamp2.go{animation:fxstamp 1.7s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes fxstamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-6deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}22%{transform:translate(-50%,-50%) scale(1.06) rotate(-2deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.96) rotate(-2deg)}}
.pop{position:absolute;left:0;top:0;pointer-events:none;z-index:7;font:800 14px var(--font);color:var(--c,#fff);text-shadow:0 0 8px var(--c,#fff),0 1px 2px #000;white-space:nowrap;animation:fxpop 1.4s ease-out forwards}
@keyframes fxpop{0%{opacity:0;margin-top:8px;scale:.6}15%{opacity:1;scale:1.25}30%{scale:1}100%{opacity:0;margin-top:-58px}}
#tip{position:absolute;z-index:20;max-width:260px;background:#0a1020f2;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12px;pointer-events:none;box-shadow:0 8px 24px #0009}
#tip b{display:block;margin-bottom:2px}
#tip span{color:var(--tx2)}
.badge{position:absolute;top:10px;left:12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);background:#0a1020b0;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
#legend{position:absolute;top:10px;right:12px;max-width:260px;background:#0a1020c8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--tx2)}
#legend b{color:var(--lens);letter-spacing:.08em;font-size:11px}
#legend li{display:flex;gap:7px;align-items:center;margin-top:3px}
#legend svg{flex:none}
#callout{position:absolute;left:12px;bottom:62px;max-width:min(440px,calc(100% - 24px));display:grid;gap:5px}
.co{background:#0a1020ea;border:1px solid var(--line2);border-left:3px solid var(--c);border-radius:8px;padding:7px 10px;font-size:12.5px}
.co b{color:var(--c)}
.co em{font-style:normal;color:var(--tx3);font-size:11px;margin-right:6px}
#transport{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 16px);background:#0a1020e0;border:1px solid var(--line2);border-radius:10px;padding:5px}
.tp button{width:36px;height:34px;border-radius:7px;border:0;background:transparent;display:grid;place-items:center}
.tp button:hover{background:#ffffff12}
.tp .sep{width:1px;height:20px;background:var(--line2);margin:0 3px}
#nogl{position:absolute;top:40px;left:12px;font-size:11px;color:var(--tx3);background:#0a1020c8;border:1px solid var(--line);border-radius:6px;padding:4px 8px}

/* svg fallback */
#svg2d text{font:600 1.05px var(--font);fill:var(--tx);text-anchor:middle;pointer-events:none}
#svg2d text.pl{font-weight:400;fill:var(--tx2);font-size:.95px}
#svg2d text.zn{font-size:1px;letter-spacing:.12px;fill:var(--tx3);text-anchor:start;text-transform:uppercase}
#svg2d .zone{fill:#111a31;stroke:var(--line);stroke-width:.08}
#svg2d .lk{stroke:#2a3a60;stroke-width:.06}
#svg2d .lk.on{stroke:var(--lens);stroke-opacity:.5;stroke-width:.09}
#svg2d .n{cursor:pointer}
#svg2d .n .sh{fill:#33405c;stroke:#0008;stroke-width:.06}
#svg2d .n.on .sh{fill:var(--lens)}
#svg2d .n.place .sh{fill:#51607f}
#svg2d .n.sel .sh{stroke:#fff;stroke-width:.2}
#svg2d .n.filtered{opacity:.15}
#svg2d .n:focus-visible{outline:none}
#svg2d .n:focus-visible .sh{stroke:#fff;stroke-width:.22}
#svg2d.nosp .spk{display:none}
#svg2d .zone.spk{fill:#2a1a10;stroke:#b5672f}
#svg2d .mk{fill:none;stroke:var(--policy);stroke-width:.14}

/* results */
.rhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--panel);padding:10px 14px;border-bottom:1px solid var(--line);z-index:5}
.rhead h2{margin-right:auto}
.runs{display:grid;gap:0}
.runs.cmp{grid-template-columns:1fr 1fr}
.run{padding:12px 14px;min-width:0;border-bottom:1px solid var(--line)}
.runs.cmp .run+.run{border-left:1px solid var(--line)}
.run h3{font-size:13px;margin-bottom:6px}
.sum{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.sum span{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--tx2)}
.verdict{border-radius:var(--r);padding:10px 12px;border:1px solid var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent);margin-bottom:10px}
.verdict .vt{font-size:17px;font-weight:750;letter-spacing:.05em;color:var(--vc);display:flex;gap:8px;align-items:center}
.verdict p{margin-top:4px;font-size:13px}
.verdict .note{font-size:11px;color:var(--tx2);font-style:italic}
.v-ALLOW{--vc:var(--ok)} .v-LIMIT{--vc:var(--limit)} .v-STEPUP{--vc:var(--step)} .v-BLOCK{--vc:var(--block)} .v-CONTAIN{--vc:var(--contain)}
.run.pending .verdict{display:none}
.run:not(.pending) .wait{display:none}
.wait{border:1px dashed var(--line2);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;color:var(--tx2);font-size:13px}
.gap{border:1px dashed var(--policy);border-radius:var(--r);padding:8px 10px;margin-bottom:10px;font-size:12px}
.gap b{color:var(--policy)}
.gap li{margin-top:3px;color:var(--tx2)}
.run h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:14px 0 6px;font-weight:650}
.graph{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.sig li{font-size:12px;display:flex;gap:6px;padding:2px 0;color:var(--tx2)}
.sig b{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.sig .up{color:var(--ok)} .sig .dn{color:var(--block)}
.sig li.dim,.tl li.dim{opacity:.35}
.tl li{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;border-left:2px solid transparent;padding-left:6px}
.tl li.cur{border-left-color:var(--c);background:#ffffff08}
.tl li.unl{opacity:.55}
.tl .n{color:var(--tx3);font-variant-numeric:tabular-nums}
.tl .p{background:none;border:0;padding:0;font-weight:650;color:var(--c);text-align:left}
.tl .p:hover{text-decoration:underline}
.tl .c{color:var(--tx3);font-size:11.5px}
.tl .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;font-size:11px;color:var(--tx3)}
.vc{font-weight:700;color:var(--vc);font-size:10.5px;letter-spacing:.06em;border:1px solid var(--vc);border-radius:4px;padding:0 4px}
.prods{display:flex;flex-wrap:wrap;gap:4px}
.pb{font-size:12px;background:none;border:1px solid var(--line2);border-radius:6px;padding:3px 7px}
.pb:hover{border-color:var(--lens)}
.lbl.gone{display:none}
.nchip{position:absolute;left:0;top:0;pointer-events:auto;cursor:help;z-index:2;font:700 10px var(--font);min-width:17px;height:17px;line-height:15px;text-align:center;border-radius:9px;background:#0a1020;border:1px solid #fff;color:#fff}
.nchip.sel{background:#fff;color:#0a1020;transform-origin:center;z-index:6;box-shadow:0 0 0 3px var(--lens)}
.tchip b{color:#fff;font-weight:700}
.prods a{font-size:12px;text-decoration:none;border:1px solid var(--line2);border-radius:6px;padding:3px 7px;color:var(--tx)}
.prods a:hover{border-color:var(--data)}
.prods a::after{content:" ↗";color:var(--tx3)}
.sug{display:grid;gap:4px}
.sug button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px}
.sug button:hover{border-color:var(--line2)}
.ctl select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.ctl small,.small{font-size:11px;color:var(--tx3)}

/* detail */
#detail{border-bottom:1px solid var(--line2);background:var(--panel2);padding:12px 14px}
#detail .x{float:right;background:none;border:1px solid var(--line2);border-radius:6px;width:28px;height:28px}
#detail h3{font-size:15px;margin-bottom:2px}
#detail .cat{font-size:11px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
#detail p{margin-top:8px;font-size:13px}
#detail dl{margin:10px 0 0;display:grid;grid-template-columns:76px 1fr;gap:6px 8px;font-size:12.5px}
#detail dt{color:var(--tx3)} #detail dd{margin:0}
.lchips{display:flex;flex-wrap:wrap;gap:4px}
.lchips span{border:1px solid var(--c);color:var(--c);border-radius:5px;padding:1px 6px;font-size:11px}
.conn .row{border-bottom:1px solid var(--line);padding:4px 0;font-size:12.5px}
.conn button{background:none;border:0;padding:0;color:var(--data);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.conn small{color:var(--tx3)}
.src{display:inline-block;margin-top:10px;font-weight:600}

footer{font-size:10.5px;color:var(--tx3);padding:5px 14px;background:var(--bg2);border-top:1px solid var(--line);text-align:center}
#tourSpot{position:fixed;z-index:70;border:2px solid var(--lens);border-radius:10px;box-shadow:0 0 0 200vmax #030610c4;pointer-events:none;transition:all .28s ease}
#tourCard{position:fixed;z-index:71;width:min(340px,calc(100vw - 24px));background:var(--panel2);border:1px solid var(--lens);border-radius:12px;padding:14px;box-shadow:0 18px 50px #000c}
#tourCard h3{font-size:16px;margin:2px 0 6px} #tourCard p{font-size:13px} #tourCard .row{display:flex;gap:6px;margin-top:12px;align-items:center} #tourCard .row span{flex:1}
#tourHint{position:fixed;z-index:55;left:50%;top:64px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--lens);border-radius:10px;padding:7px 9px 7px 12px;font-size:13px;box-shadow:0 10px 30px #0009;max-width:calc(100vw - 20px)}
/* export menu */

  /* ---------------- RULE TABLE ----------------
     paths: the most specific matching rule wins (ties: the later rule); a rule with no `when` is the fallback.
     '@loc' = the chosen location, '@dest' = the chosen destination. */
  paths: {
    access: [
      { id: 'AC-0', nodes: ['@loc'] },
      { id: 'AC-remote', when: { loc: ['$REMOTE'] }, nodes: ['@loc'] },
      { id: 'AC-internet', when: { loc: ['internet'] }, nodes: ['internet'] },
      { id: 'AC-hq', when: { loc: ['hq'] }, nodes: ['hq', 'wireless', 'switches'] },
      { id: 'AC-hq-wired', when: { loc: ['hq'], device: ['headless'] }, nodes: ['hq', 'switches'] },
      { id: 'AC-branch', when: { loc: ['branch'] }, nodes: ['branch', 'sdwan'] },
      { id: 'AC-factory', when: { loc: ['factory'] }, nodes: ['factory', 'industrial'] },
      { id: 'AC-remote-client', when: { loc: ['$REMOTE'], device: ['$MANAGED'] }, nodes: ['@loc', 'client'] },
      { id: 'AC-workload', when: { device: ['server'] }, nodes: ['workload', 'nexus'] }
    ],
    route: [
      { id: 'RT-0', nodes: ['sa', '@dest'] },
      { id: 'RT-dc', when: { dest: ['$DC'] }, nodes: ['fw', 'nexus', '@dest'] },
      { id: 'RT-dc-remote', when: { dest: ['$DC'], loc: ['$REMOTE'] }, nodes: ['sa', 'fw', 'nexus', '@dest'] },
      { id: 'RT-dc-workload', when: { dest: ['$DC'], device: ['server'] }, nodes: ['@dest'] },
      { id: 'RT-cloud', when: { dest: ['cloudapp'] }, nodes: ['sa', 'mcd', 'cloudapp'] },
      { id: 'RT-cloud-onprem', when: { dest: ['cloudapp'], loc: ['$ONPREM'] }, nodes: ['sdwan', 'mcd', 'cloudapp'] },
      { id: 'RT-cloud-workload', when: { dest: ['cloudapp'], device: ['server'] }, nodes: ['fw', 'mcd', 'cloudapp'] },
      { id: 'RT-cloud-internet', when: { dest: ['cloudapp'], loc: ['internet'] }, nodes: ['waap', 'mcd', 'cloudapp'] },
      { id: 'RT-inet', when: { dest: ['$INET'] }, nodes: ['sa', '@dest'] },
      { id: 'RT-inet-onprem', when: { dest: ['$INET'], loc: ['$ONPREM'] }, nodes: ['sdwan', 'sa', '@dest'] },
      { id: 'RT-inet-workload', when: { dest: ['$INET'], device: ['server'] }, nodes: ['fw', '@dest'] },
      { id: 'RT-inet-internet', when: { dest: ['$INET'], loc: ['internet'] }, nodes: ['@dest'] },
      { id: 'RT-ot', when: { dest: ['ot'] }, nodes: ['fw', 'industrial', 'otctl'] },
      { id: 'RT-ot-factory', when: { dest: ['ot'], loc: ['factory'] }, nodes: ['otctl'] },
      { id: 'RT-ot-remote', when: { dest: ['ot'], loc: ['$REMOTE'] }, nodes: ['sea', 'industrial', 'otctl'] }
    ]
  },

  /* checks: every matching rule fires in path order.
     when: who/device/loc/dest (any-of), beh (any-of), ball (all-of), nbeh (none-of), not{}, via/nvia (path contains / lacks node)
     hop : path node where the check happens (first present wins). post:true = happens after the path (response / operations).
     at  : the product doing the checking.   d: trust change.   sig: the signal that moved the score.
     v   : verdict this rule argues for. Highest severity wins: ALLOW < LIMIT < STEPUP < BLOCK < CONTAIN.
           STEPUP, BLOCK and CONTAIN on the path stop the traffic at that hop.
     tele: emits telemetry that XDR can correlate.  base: routine check, skipped once the session is stopped at that hop. */
  checks: [
    /* --- network identity and segmentation --- */
    { id: 'N1', when: { via: ['$ACC'], not: { device: ['headless', 'server'], who: ['guest', 'attacker'] } }, hop: ['$ACC'], at: 'ise', lens: 'identity',
      c: 'Network access control', r: 'User and device authenticated to the network; segment assigned from identity', d: 5, sig: 'Network identity established' },
    { id: 'N2', when: { device: ['headless'], via: ['$ACC'] }, hop: ['$ACC'], at: 'ise', lens: 'identity',
      c: 'Endpoint profiling', r: 'Headless device profiled and placed in a least-privilege segment', d: 5, sig: 'Device profiled',
      v: 'LIMIT', why: 'Headless devices are profiled and confined to a least-privilege segment.' },
    { id: 'N3', when: { who: ['guest'], dest: ['$INET'], via: ['$ACC'] }, hop: ['$ACC'], at: 'ise', lens: 'policy',
      c: 'Guest access', r: 'Guest identity mapped to an internet-only segment',
      v: 'LIMIT', why: 'Guests receive internet access only, isolated from internal resources.' },
    { id: 'N4', when: { who: ['guest'], dest: ['$PRIV'], via: ['$ACC'] }, hop: ['$ACC'], at: 'ise', lens: 'policy',

      v: 'BLOCK', why: 'Guest access is internet-only; internal resources are unreachable from the guest segment.' },
    { id: 'N5', when: { who: ['iot', 'ot'], dest: ['dcapp', 'cloudapp', 'intai'], via: ['$ACC'] }, hop: ['$ACC'], at: 'ise', lens: 'policy',
      c: 'Device segmentation', r: 'Destination is outside what this device profile may reach', d: -10, sig: 'Out-of-profile destination',
      v: 'BLOCK', why: 'The device’s segment only permits the destinations its profile needs.' },
    { id: 'N6', when: { who: ['iot'], dest: ['ot'], via: ['$ACC'] }, hop: ['$ACC'], at: 'ise', lens: 'policy',
      c: 'Device segmentation', r: 'IT-side device has no path into the industrial zone', d: -10, sig: 'Out-of-profile destination',
      v: 'BLOCK', why: 'The device’s segment only permits the destinations its profile needs.' },
    { id: 'N7', when: { who: ['ot'], dest: ['$INET'], via: ['industrial'] }, hop: ['industrial'], at: 'cv', lens: 'policy',
      c: 'Zones and conduits', r: 'No conduit is defined from this OT zone to the internet', d: -10, sig: 'Out-of-zone destination',
      v: 'BLOCK', why: 'OT assets communicate only through defined zones and conduits.' },

    { id: 'P3', when: { device: ['stale'], loc: ['$ONPREM'], via: ['$ACC'] }, hop: ['$ACC'], at: 'ise', lens: 'identity',

    { id: 'P4', when: { device: ['stale'], loc: ['$REMOTE'] }, hop: ['$AUTH'], at: 'duo', lens: 'identity',

    { id: 'P5', when: { device: ['byod', 'claptop'], who: ['emp', 'admin', 'exec', 'contractor', 'insider'] }, hop: ['$AUTH'], at: 'duo', lens: 'identity',
      c: 'Device trust', r: 'Device is not managed by the organisation; trust not established', d: -10, sig: 'Unmanaged device',
      v: 'LIMIT', why: 'Unmanaged devices receive limited access.' },

    /* --- identity analytics, then authentication --- */

      c: 'Identity analytics', r: 'Abnormal authentication pattern flagged on the account', d: -10, sig: 'Identity risk raised',

    { id: 'M1', when: { who: ['emp', 'exec', 'contractor', 'insider'], nbeh: ['mfa_fail', 'fatigue', 'stolen'] }, hop: ['$AUTH'], at: 'duo', lens: 'identity',
      c: 'User authentication', r: 'User verified with phishing-resistant MFA', d: 10, sig: 'MFA passed' },
    { id: 'M1b', when: { who: ['$AUTHN'], ball: ['stolen', 'mfa_ok'] }, hop: ['$AUTH'], at: 'duo', lens: 'identity',
      c: 'User authentication', r: 'MFA challenge completed', d: 5, sig: 'MFA passed' },
    { id: 'M2', when: { who: ['admin'], beh: ['mfa_ok'], nbeh: ['stolen'] }, hop: ['$AUTH'], at: 'duo', lens: 'identity',

    { id: 'M4', when: { who: ['$AUTHN'], beh: ['mfa_fail'] }, hop: ['$AUTH'], at: 'duo', lens: 'identity',

    { id: 'T2', when: { beh: ['scan'], via: ['switches', 'nexus'] }, hop: ['switches', 'nexus'], at: 'sna', lens: 'threat', tele: true,

    { id: 'T5', when: { beh: ['scan'], via: ['industrial'] }, hop: ['industrial'], at: 'cv', lens: 'threat', tele: true,

    { id: 'W2p', when: { beh: ['phish'], via: ['sa'] }, hop: ['sa'], at: 'sa', lens: 'threat',

      v: 'BLOCK', why: 'The phishing destination is blocked, and phishing-resistant authentication prevents credential replay.' },
    { id: 'W2f', when: { beh: ['malfile'], dest: ['$INET'], via: ['sa'] }, hop: ['sa'], at: 'sa', lens: 'threat',
