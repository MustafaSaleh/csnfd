<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living Network — conceptual architecture explainer</title>
<meta name="description" content="Independent interactive explainer: how Cisco networking and security products work together across data, identity, policy, threat and trust.">
<meta name="referrer" content="no-referrer">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-lens="data" data-sheet="none">
<header id="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 26 9v12L15 27 4 21V9z" fill="none" stroke="var(--lens)" stroke-width="1.6"/><path d="M15 3v24M4 9l22 12M26 9 4 21" stroke="var(--lens)" stroke-width=".8" opacity=".5"/><circle cx="15" cy="15" r="3" fill="var(--lens)"/></svg>
    <div><h1>Living Network</h1><p>Conceptual architecture · how Cisco networking and security work together</p></div>
  </div>
  <div class="lenses" id="lenses" role="radiogroup" aria-label="Lens"></div>
  <button id="spT" class="btn" aria-pressed="true" title="Show or hide the Splunk layer (L)">Splunk layer</button>
 <button id="fxT" class="btn tg" aria-pressed="true" aria-label="Visual effects" title="Visual effects on or off (X)">FX</button>
  <button id="sndT" class="btn tg" aria-pressed="true" aria-label="Sound effects" title="Sound effects on or off (M)">SFX</button>
  <button id="musT" class="btn tg" aria-pressed="true" aria-label="Ambient music" title="Ambient music on or off (N)">Music</button>
  <button id="warT" class="btn tg" aria-pressed="true" aria-label="Fog of war" title="Fog of war in the 3rd and 1st person views: only what the actor has reached is visible (G)">Fog</button>
  <button id="tourT" class="btn" title="Guided tour of the tool (T)">Tour</button>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off">
    <select id="qcat" aria-label="Filter by category"></select>
    <div id="qres" hidden></div>
  </div>
</header>
<main>
  <aside id="left" class="panel" aria-label="Scenario">
    <div class="modes" role="tablist" aria-label="Mode">
      <button role="tab" data-mode="presets">Presets</button>
      <button role="tab" data-mode="build">Build your own</button>
      <button role="tab" data-mode="explore">Free explore</button>
      <button role="tab" data-mode="topo">Topology</button>
    </div>
    <div id="leftBody" class="pad"></div>
  </aside>
  <section id="stage" aria-label="Conceptual architecture scene">
    <canvas id="gl" tabindex="0" aria-label="3D conceptual network scene. Tab moves through product labels. Arrow keys rotate, Shift plus arrows pan, plus and minus zoom, zero resets the view." role="img"></canvas>
    <svg id="svg2d" hidden role="group" aria-label="2D conceptual network map"></svg>
    <div id="labels"></div>
    <div class="badge">Conceptual architecture — not a validated design</div>
    <div id="legend" aria-live="polite"></div>
    <div id="callout" aria-live="polite"></div>
    <div id="nogl" hidden>2D fallback view (WebGL or 3D library unavailable)</div>
    <div id="transport" class="tp" role="toolbar" aria-label="Playback">
      <button id="bRestart" aria-label="Restart" title="Restart"></button>
      <button id="bPlay" aria-label="Play" title="Play / pause (Space)"></button>
      <button id="bStep" aria-label="Step to next checkpoint" title="Step"></button>
      <button id="bEnd" aria-label="Skip to result" title="Skip to result"></button>
      <button id="bAuto" class="txt" aria-pressed="false" title="Auto-play: start a scenario as soon as it is chosen">Auto</button>
      <span class="sep"></span>
      <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      <span class="sep"></span>
      <select id="viewSel" aria-label="Camera view" title="Camera view (V)"><option value="orbit">Overview</option><option value="third">3rd person</option><option value="first">1st person</option></select>
      <button id="bView" aria-label="Reset view" title="Reset view (0)"></button>
      <button id="bFull" aria-label="Full screen" aria-pressed="false" title="Full screen (F)"></button>
    </div>
    <div id="fxflash" aria-hidden="true"></div>
    <div id="fxstamp" aria-hidden="true"></div>
    <div id="fxstamp2" class="fxstamp" aria-hidden="true"></div>
    <div id="splitUI" aria-hidden="true"><i></i><b>A</b><b>B</b></div>
    <button id="fullL" class="ftab" aria-pressed="false" title="Show or hide the scenario panel ([)">Scenario</button>
    <button id="fullR" class="ftab" aria-pressed="false" title="Show or hide the result panel (])">Result</button>
    <div id="tip" role="tooltip" hidden></div>
  </section>
  <aside id="right" class="panel" aria-label="Result and product detail">
    <div id="detail" hidden></div>
    <div id="result"></div>
  </aside>
</main>
<nav id="mobnav" aria-label="Panels">
  <button data-sheet="left">Scenario</button>
  <button data-sheet="none">Scene</button>
  <button data-sheet="right">Result</button>
</nav>
<footer id="foot"></footer>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="tourSpot" hidden></div>
<div id="tourCard" role="dialog" aria-labelledby="tourH" hidden>
  <p class="small" id="tourN"></p><h3 id="tourH"></h3><p id="tourX"></p>
  <div class="row"><button class="btn" id="tourSkip">End tour</button><span></span><button class="btn" id="tourBack">Back</button><button class="btn primary" id="tourNext">Next</button></div>
</div>
<div id="tourHint" hidden><span>New here? Take the one-minute tour.</span><button class="btn primary" id="tourStart">Start</button><button class="btn" id="tourNo" aria-label="Dismiss">×</button></div>
<div id="report" aria-hidden="true"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/state.js"></script>
<script src="js/sound.js"></script>
<script src="js/effects.js"></script>
<script src="js/ui.js"></script>
<script src="js/scene.js"></script>
<script src="js/render-gl.js"></script>
<script src="js/render-svg.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
